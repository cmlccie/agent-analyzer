apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-analyzer
  namespace: default
---
# Read-only access to Services and Endpoints — no secrets, no write permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-analyzer
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-analyzer
subjects:
  - kind: ServiceAccount
    name: agent-analyzer
    namespace: default
roleRef:
  kind: ClusterRole
  name: agent-analyzer
  apiGroup: rbac.authorization.k8s.io
