[package]
name = "agent-analyzer"
version = "0.1.0"
edition = "2024"
description = "Kubernetes-native AI component discovery and reachability analyzer"
license = "MIT"

[[bin]]
name = "agent-analyzer"
path = "src/main.rs"

[lib]
name = "agent_analyzer"
path = "src/lib.rs"

[dependencies]
# CLI / logging
clap = { version = "4", features = ["derive", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Config + serde
serde = { version = "1", features = ["derive"] }
serde_yaml_neo = "0.11"
serde_json = "1"
notify = "6"

# HTTP server / client
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = { version = "2", features = ["serde"] }

# K8s — added in step 7 (kubernetes discovery)
kube = { version = "3", features = ["runtime"] }
k8s-openapi = { version = "0.27", features = ["latest"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Misc
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
axum-test = "20"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
